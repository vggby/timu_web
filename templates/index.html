<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库工坊 | Quiz Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161922;
            --bg-tertiary: #1e2230;
            --bg-elevated: #252a3a;
            --text-primary: #e8eaf0;
            --text-secondary: #8b90a0;
            --text-muted: #505468;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.15);
            --accent-glow-strong: rgba(108, 92, 231, 0.3);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --success: #00cec9;
            --success-bg: rgba(0,206,201,0.1);
            --warning: #fdcb6e;
            --warning-bg: rgba(253,203,110,0.1);
            --error: #ff7675;
            --error-bg: rgba(255,118,117,0.1);
            --processing: #74b9ff;
            --processing-bg: rgba(116,185,255,0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px var(--accent-glow);
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body.loading * { animation-play-state: paused; }

        /* Page fade-in */
        @keyframes pageIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body { animation: pageIn 0.6s ease; }

        /* Ambient background */
        .ambient-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% -10%, rgba(108,92,231,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 110%, rgba(0,206,201,0.05) 0%, transparent 50%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(108,92,231,0.02) 0%, transparent 50%);
        }

        /* Noise texture overlay */
        .ambient-bg::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15,17,23,0.8);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0;
        }

        .logo {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.4rem; font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            display: flex; align-items: center; gap: 10px;
            user-select: none;
        }

        .logo-icon {
            width: 34px; height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem;
            box-shadow: var(--shadow-glow);
        }

        .nav-links {
            display: flex; align-items: center; gap: 4px;
        }

        .nav-links a, .nav-links button {
            color: var(--text-secondary);
            text-decoration: none; font-size: 0.875rem;
            padding: 8px 14px; border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            background: none; border: none; cursor: pointer;
            font-family: inherit; font-size: inherit;
            display: flex; align-items: center; gap: 6px;
        }

        .nav-links a:hover, .nav-links button:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        /* Hamburger */
        .hamburger {
            display: none;
            width: 40px; height: 40px;
            background: none; border: none; cursor: pointer;
            flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            padding: 8px;
        }

        .hamburger span {
            display: block; width: 20px; height: 2px;
            background: var(--text-secondary);
            border-radius: 2px;
            transition: all var(--transition-normal);
        }

        .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .mobile-menu {
            display: none;
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 24px 16px;
            flex-direction: column; gap: 2px;
            animation: slideDown 0.25s ease;
        }

        .mobile-menu.open { display: flex; }

        .mobile-menu a, .mobile-menu button {
            color: var(--text-secondary); text-decoration: none;
            padding: 12px 16px; border-radius: var(--radius-sm);
            font-size: 0.95rem; transition: all var(--transition-fast);
            background: none; border: none; cursor: pointer;
            font-family: inherit; text-align: left;
            display: flex; align-items: center; gap: 8px;
        }

        .mobile-menu a:hover, .mobile-menu button:hover {
            background: var(--bg-tertiary); color: var(--text-primary);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 72px 0 48px;
        }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 16px 6px 8px;
            background: var(--accent-glow);
            border: 1px solid rgba(108,92,231,0.2);
            border-radius: 100px;
            font-size: 0.8rem; color: var(--accent-light);
            margin-bottom: 24px;
            animation: fadeUp 0.6s ease 0.1s both;
        }

        .hero-badge .dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .hero h1 {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            animation: fadeUp 0.6s ease 0.2s both;
        }

        .hero h1 .gradient-text {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 50%, var(--success) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 520px;
            margin: 0 auto;
            animation: fadeUp 0.6s ease 0.3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== INPUT SECTION ===== */
        .input-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 32px;
            margin-bottom: 48px;
            box-shadow: var(--shadow-md);
            animation: fadeUp 0.6s ease 0.4s both;
            position: relative;
            overflow: hidden;
        }

        .input-section::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow-strong), transparent);
        }

        .input-row {
            display: flex; gap: 12px; margin-bottom: 12px;
        }

        .input-field {
            flex: 1; position: relative;
        }

        .input-field input[type="url"] {
            width: 100%;
            padding: 14px 18px 14px 44px;
            font-size: 0.95rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            transition: all var(--transition-fast);
        }

        .input-field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-field input::placeholder { color: var(--text-muted); }

        .input-field .input-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 1.1rem; pointer-events: none;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            appearance: none; -webkit-appearance: none;
            padding: 14px 36px 14px 14px;
            font-size: 0.875rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition-fast);
            min-width: 130px;
        }

        .select-wrap select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .select-wrap::after {
            content: '▾';
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 0.8rem;
            pointer-events: none;
        }

        .btn-row {
            display: flex; gap: 10px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 0.9rem; font-weight: 600;
            border: none; border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            white-space: nowrap;
            position: relative; overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #7c6cf0);
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px var(--accent-glow-strong);
        }

        .btn-primary:active:not(:disabled) { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.5; cursor: not-allowed; transform: none;
        }

        .btn-primary.is-loading .btn-text { opacity: 0; }
        .btn-primary.is-loading .btn-spinner { display: block; }

        .btn-spinner {
            display: none;
            position: absolute;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover:not(:disabled) {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-sm {
            padding: 7px 14px; font-size: 0.8rem;
            border-radius: var(--radius-sm);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Status bar */
        .status-bar {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            display: none;
            align-items: center; gap: 12px;
            animation: fadeUp 0.3s ease;
        }

        .status-bar.show { display: flex; }

        .status-bar.is-loading {
            background: var(--processing-bg);
            border: 1px solid rgba(116,185,255,0.2);
            color: var(--processing);
        }

        .status-bar.is-success {
            background: var(--success-bg);
            border: 1px solid rgba(0,206,201,0.2);
            color: var(--success);
        }

        .status-bar.is-error {
            background: var(--error-bg);
            border: 1px solid rgba(255,118,117,0.2);
            color: var(--error);
        }

        .status-spinner {
            width: 18px; height: 18px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        .status-bar .progress-track {
            flex: 1; height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
            margin-left: 4px;
        }

        .status-bar .progress-fill {
            height: 100%;
            background: currentColor;
            border-radius: 2px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ===== TASKS SECTION ===== */
        .tasks-section {
            padding-bottom: 80px;
            animation: fadeUp 0.6s ease 0.5s both;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }

        .section-title {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.3rem; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
        }

        .section-title .title-bar {
            width: 3px; height: 20px;
            background: linear-gradient(180deg, var(--accent), var(--accent-light));
            border-radius: 2px;
        }

        .section-title .count {
            font-size: 0.8rem; font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 2px 10px; border-radius: 100px;
        }

        /* Search & Filter */
        .filter-bar {
            display: flex; align-items: center; gap: 8px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 8px 14px 8px 34px;
            font-size: 0.85rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            width: 200px;
            transition: all var(--transition-fast);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            width: 260px;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box .search-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            font-size: 0.85rem; pointer-events: none; color: var(--text-muted);
        }

        .filter-chips {
            display: flex; gap: 4px;
        }

        .filter-chip {
            padding: 6px 14px;
            font-size: 0.8rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-fast);
        }

        .filter-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .filter-chip.active {
            background: var(--accent-glow);
            border-color: rgba(108,92,231,0.3);
            color: var(--accent-light);
        }

        /* Task Cards Grid */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
            animation: cardIn 0.4s ease both;
        }

        .task-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: transparent;
            transition: background var(--transition-normal);
        }

        .task-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .task-card:hover::before {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
        }

        .task-card.status-completed:hover::before {
            background: linear-gradient(90deg, var(--success), #55efc4);
        }

        .task-card.status-failed:hover::before {
            background: linear-gradient(90deg, var(--error), #fab1a0);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 12px; gap: 12px;
        }

        .card-title {
            font-size: 0.95rem; font-weight: 500;
            line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }

        .status-badge {
            flex-shrink: 0;
            font-size: 0.75rem; font-weight: 500;
            padding: 4px 10px;
            border-radius: 100px;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }

        .status-badge .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-badge.s-completed { background: var(--success-bg); color: var(--success); }
        .status-badge.s-building, .status-badge.s-processing {
            background: var(--processing-bg); color: var(--processing);
        }
        .status-badge.s-building .status-dot, .status-badge.s-processing .status-dot {
            animation: pulse 1.5s ease infinite;
        }
        .status-badge.s-partial { background: var(--warning-bg); color: var(--warning); }
        .status-badge.s-failed { background: var(--error-bg); color: var(--error); }

        .card-meta {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            font-size: 0.8rem; color: var(--text-muted);
            margin-bottom: 14px;
        }

        .meta-tag {
            padding: 2px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .meta-divider {
            width: 3px; height: 3px;
            background: var(--text-muted);
            border-radius: 50%;
        }

        .card-progress {
            height: 3px;
            background: rgba(255,255,255,0.04);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .card-progress .bar {
            height: 100%;
            background: linear-gradient(90deg, var(--processing), var(--accent-light));
            border-radius: 2px;
            transition: width 0.5s ease;
            animation: progressPulse 2s ease infinite;
        }

        @keyframes progressPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .card-actions {
            display: flex; gap: 8px; align-items: center;
        }

        .card-actions .btn-open {
            padding: 6px 14px;
            font-size: 0.8rem; font-weight: 500;
            background: var(--success-bg);
            border: 1px solid rgba(0,206,201,0.2);
            border-radius: var(--radius-sm);
            color: var(--success);
            text-decoration: none;
            transition: all var(--transition-fast);
            display: inline-flex; align-items: center; gap: 5px;
        }

        .card-actions .btn-open:hover {
            background: rgba(0,206,201,0.2);
            transform: translateY(-1px);
        }

        .card-actions .btn-detail {
            padding: 6px 14px;
            font-size: 0.8rem; font-weight: 500;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer; font-family: inherit;
            transition: all var(--transition-fast);
        }

        .card-actions .btn-detail:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            grid-column: 1 / -1;
        }

        .empty-state .empty-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            opacity: 0.6;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .empty-state h3 {
            font-size: 1.1rem; font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Skeleton loading */
        .skeleton-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            animation: skeletonPulse 1.5s ease infinite;
        }

        .skeleton-line {
            height: 14px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .skeleton-line.w60 { width: 60%; }
        .skeleton-line.w40 { width: 40%; }
        .skeleton-line.w80 { width: 80%; }
        .skeleton-line.short { height: 10px; width: 30%; }

        @keyframes skeletonPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ===== SIDEBAR (Quiz Menu) ===== */
        .sidebar-overlay {

    <script>
    // ===== STATE =====
    let allTasks = [];
    let currentFilter = 'all';
    let currentTaskId = null;

    // ===== NAVIGATION =====
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        const btn = document.getElementById('hamburger');
        menu.classList.toggle('open');
        btn.classList.toggle('open');
    }

    // ===== SIDEBAR =====
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const isOpen = sidebar.classList.contains('open');
        if (isOpen) {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        } else {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            loadSidebar();
        }
    }

    async function loadSidebar() {
        try {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            const completed = tasks.filter(t => t.status === 'completed');
            document.getElementById('quizCount').textContent = completed.length;
            const list = document.getElementById('sidebarList');
            if (completed.length === 0) {
                list.innerHTML = '<div class="sidebar-empty"><div class="empty-emoji">📭</div><p>暂无已完成的题库</p></div>';
                return;
            }
            list.innerHTML = completed.map(t => {
                const title = t.title || t.url;
                const type = t.question_type === 'answer' ? '问答题' : '选择题';
                const date = new Date(t.created_at).toLocaleDateString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                return `<a class="sidebar-item" href="data/${t.id}/site/index.html" target="_blank">
                    <div class="item-title">${escapeHtml(title)}</div>
                    <div class="item-meta">
                        <span class="item-tag">${type}</span>
                        <span>${date}</span>
                    </div>
                </a>`;
            }).join('');
        } catch(e) {
            document.getElementById('sidebarList').innerHTML = '<div class="sidebar-empty"><div class="empty-emoji">⚠️</div><p>加载失败</p></div>';
        }
    }

    // ===== MODELS =====
    async function loadModels() {
        try {
            const res = await fetch('/api/models');
            const data = await res.json();
            const select = document.getElementById('modelConfig');
            select.innerHTML = '<option value="">🤖 默认模型</option>';
            if (data.models && data.models.length > 0) {
                data.models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = m.model || m.name;
                    select.appendChild(opt);
                });
            }
        } catch (e) {
            console.error('加载模型失败:', e);
        }
    }
    </script>
    <script>
    // ===== TASKS =====
    async function loadTasks() {
        try {
            const res = await fetch('/api/tasks');
            allTasks = await res.json();
            document.getElementById('taskCount').textContent = allTasks.length;
            renderTasks();
        } catch (e) {
            console.error('加载任务失败:', e);
            document.getElementById('tasksGrid').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3>加载失败</h3><p>请刷新页面重试</p></div>';
        }
    }

    function renderTasks() {
        const grid = document.getElementById('tasksGrid');
        const search = document.getElementById('searchInput').value.trim().toLowerCase();

        let filtered = allTasks;

        // Filter by status
        if (currentFilter === 'completed') {
            filtered = filtered.filter(t => t.status === 'completed');
        } else if (currentFilter === 'processing') {
            filtered = filtered.filter(t => t.status === 'building' || t.status === 'processing');
        } else if (currentFilter === 'failed') {
            filtered = filtered.filter(t => t.status === 'failed' || t.status === 'partial');
        }

        // Filter by search
        if (search) {
            filtered = filtered.filter(t => {
                const title = (t.title || t.url || '').toLowerCase();
                return title.includes(search);
            });
        }

        if (filtered.length === 0) {
            const isSearch = search || currentFilter !== 'all';
            grid.innerHTML = isSearch
                ? '<div class="empty-state"><div class="empty-icon">🔍</div><h3>没有匹配的记录</h3><p>试试其他搜索词或筛选条件</p></div>'
                : '<div class="empty-state"><div class="empty-icon">🚀</div><h3>还没有任何记录</h3><p>输入一个试题页面 URL 开始生成题库吧</p></div>';
            return;
        }

        grid.innerHTML = filtered.map((task, i) => {
            const title = task.title || task.url;
            const isCompleted = task.status === 'completed';
            const isProcessing = task.status === 'building' || task.status === 'processing';
            const isFailed = task.status === 'failed';
            const type = task.question_type === 'answer' ? '问答题' : '选择题';
            const model = task.model_config || '默认';
            const date = formatDate(task.created_at);
            const progress = task.progress;
            const percent = progress && progress.percent ? progress.percent : 0;

            let progressHtml = '';
            if (isProcessing) {
                progressHtml = `<div class="card-progress"><div class="bar" style="width:${Math.max(percent, 5)}%"></div></div>`;
            }

            let actionsHtml = '<div class="card-actions">';
            if (isCompleted) {
                actionsHtml += `<a class="btn-open" href="data/${task.id}/site/index.html" target="_blank" onclick="event.stopPropagation()">📖 打开题库</a>`;
            }
            actionsHtml += `<button class="btn-detail" onclick="event.stopPropagation(); viewTask('${task.id}')">详情</button>`;
            actionsHtml += '</div>';

            return `<div class="task-card status-${task.status}" onclick="viewTask('${task.id}')" style="animation-delay:${i * 0.05}s">
                <div class="card-top">
                    <div class="card-title">${escapeHtml(title)}</div>
                    <span class="status-badge s-${task.status}">
                        <span class="status-dot"></span>
                        ${getStatusText(task.status)}
                    </span>
                </div>
                <div class="card-meta">
                    <span class="meta-tag">${type}</span>
                    <span class="meta-divider"></span>
                    <span>${model}</span>
                    <span class="meta-divider"></span>
                    <span>${date}</span>
                </div>
                ${progressHtml}
                ${actionsHtml}
            </div>`;
        }).join('');
    }

    function filterTasks() { renderTasks(); }

    function setFilter(filter, el) {
        currentFilter = filter;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderTasks();
    }
    </script>
    <script>
    // ===== GENERATE & POLL =====
    function showStatus(msg, type) {
        const bar = document.getElementById('statusBar');
        bar.className = 'status-bar show is-' + type;
        document.getElementById('statusText').textContent = msg;
        if (type !== 'loading') {
            document.getElementById('progressFill').style.width = '0%';
        }
    }

    function hideStatus() {
        document.getElementById('statusBar').className = 'status-bar';
    }

    async function pollTask(taskId, btn) {
        let dots = 0;
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');
        const poll = setInterval(async () => {
            try {
                const res = await fetch(`/api/task/${taskId}`);
                const task = await res.json();
                dots = (dots + 1) % 4;
                const d = '.'.repeat(dots + 1);

                if (task.status === 'completed') {
                    clearInterval(poll);
                    showStatus('🎉 生成完成！', 'success');
                    progressFill.style.width = '100%';
                    if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
                    loadTasks();
                    setTimeout(() => viewTask(taskId), 500);
                    return;
                } else if (task.status === 'failed') {
                    clearInterval(poll);
                    showStatus('生成失败: ' + (task.error || '未知错误'), 'error');
                    if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
                    loadTasks();
                    return;
                }

                if (task.progress) {
                    const p = task.progress;
                    if (p.stage && p.current !== undefined && p.total !== undefined) {
                        if (p.total > 0) {
                            statusText.textContent = `${p.message || p.stage} ${p.current}/${p.total} (${p.percent}%)${d}`;
                            progressFill.style.width = p.percent + '%';
                        } else {
                            statusText.textContent = `${p.message || p.stage}${d}`;
                        }
                    } else {
                        statusText.textContent = `AI 正在生成解析${d}（题目较多时需要几分钟）`;
                    }
                } else {
                    statusText.textContent = `AI 正在生成解析${d}（题目较多时需要几分钟）`;
                }
            } catch(e) {}
        }, 2000);
    }

    async function generate() {
        const url = document.getElementById('urlInput').value.trim();
        const questionType = document.getElementById('questionType').value;
        const modelConfig = document.getElementById('modelConfig').value;
        const btn = document.getElementById('generateBtn');
        if (!url) { showStatus('请输入 URL', 'error'); return; }

        btn.disabled = true;
        btn.classList.add('is-loading');
        showStatus('正在抓取页面...', 'loading');

        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, question_type: questionType, model_config: modelConfig})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('urlInput').value = '';
                showStatus('AI 正在生成解析...', 'loading');
                pollTask(data.task_id, btn);
            } else {
                showStatus(data.error || '生成失败', 'error');
                btn.disabled = false;
                btn.classList.remove('is-loading');
            }
        } catch (e) {
            showStatus('请求失败: ' + e.message, 'error');
            btn.disabled = false;
            btn.classList.remove('is-loading');
        }
    }

    async function demo() {
        const btn = document.getElementById('demoBtn');
        btn.disabled = true;
        showStatus('正在使用示例数据生成题库...', 'loading');

        try {
            const res = await fetch('/api/demo', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                showStatus('AI 正在生成解析...', 'loading');
                pollTask(data.task_id, btn);
            } else {
                showStatus(data.error || '生成失败', 'error');
                btn.disabled = false;
            }
        } catch (e) {
            showStatus('请求失败: ' + e.message, 'error');
            btn.disabled = false;
        }
    }
    </script>
    <script>
    // ===== MODAL & VIEW TASK =====
    async function viewTask(taskId) {
        currentTaskId = taskId;
        try {
            const res = await fetch(`/api/task/${taskId}`);
            const task = await res.json();
            document.getElementById('modalTitle').textContent = task.title || task.url;
            const fileList = document.getElementById('fileList');
            const files = (task.files || []);
            if (files.length === 0) {
                fileList.innerHTML = '<p style="color:var(--text-muted);">无生成内容' + (task.error ? '：' + escapeHtml(task.error) : '') + '</p>';
                document.getElementById('fileContent').textContent = task.error || '无内容';
            } else {
                const htmlFiles = files.filter(f => f.endsWith('.html'));
                const sortedFiles = [...htmlFiles, ...files.filter(f => !f.endsWith('.html'))];
                fileList.innerHTML = sortedFiles.map((f, i) => `
                    <button class="file-tab ${i === 0 ? 'active' : ''}" onclick="showFile('${taskId}/${f}', this, '${f}')">${f.split('/').pop()}</button>
                `).join('');
                showFile(`${taskId}/${sortedFiles[0]}`, fileList.querySelector('.file-tab'), sortedFiles[0]);
            }
            document.getElementById('modal').classList.add('active');
        } catch(e) {
            console.error('查看任务失败:', e);
        }
    }

    function showFile(filePath, btn, filename) {
        document.querySelectorAll('.file-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const contentEl = document.getElementById('fileContent');
        if (filename && filename.endsWith('.html')) {
            fetch(`/data/${filePath}`)
                .then(r => r.text())
                .then(html => {
                    contentEl.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.style.cssText = 'width:100%;height:70vh;border:none;background:#fff;border-radius:8px;';
                    iframe.srcdoc = html;
                    contentEl.appendChild(iframe);
                });
        } else {
            fetch(`/data/${filePath}`)
                .then(r => r.text())
                .then(text => { contentEl.textContent = text; });
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    // ===== UTILITIES =====
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function getStatusText(status) {
        const map = {
            'completed': '已完成',
            'building': '生成中',
            'partial': '部分完成',
            'failed': '失败',
            'processing': '处理中'
        };
        return map[status] || status;
    }

    function formatDate(isoString) {
        const d = new Date(isoString);
        return d.toLocaleDateString('zh-CN', {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    // ===== INIT =====
    document.getElementById('urlInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') generate();
    });

    // ESC to close modal
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeModal();
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) toggleSidebar();
        }
    });

    loadModels();
    loadTasks();
    </script>
</body>
