<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统架构设计师 · 预测题</title>
<style>
:root{--primary:#6366f1;--primary-bg:#eef2ff;--success:#059669;--success-bg:#d1fae5;--danger:#dc2626;--danger-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
a{color:var(--primary);text-decoration:none}

/* Header */
.hdr{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.hdr h1{font-size:1.15em;display:flex;align-items:center;gap:8px}
.hdr h1 .ico{font-size:1.4em}
.hdr .sub{font-size:.8em;opacity:.85;margin-top:2px}
.prog{height:4px;background:rgba(255,255,255,.25);margin-top:8px;border-radius:2px}
.prog .bar{height:100%;background:#34d399;border-radius:2px;transition:width .4s;width:0}

/* Container */
.ctn{max-width:780px;margin:0 auto;padding:10px}

/* Filter pills */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;justify-content:center}
.fpill{padding:4px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);font-size:.78em;cursor:pointer;transition:.15s;white-space:nowrap}
.fpill:hover{border-color:var(--primary);color:var(--primary)}
.fpill.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Nav dots */
.nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px 0 12px;background:var(--card);border-radius:var(--radius);margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ndot{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:700;cursor:pointer;transition:.15s;background:var(--card)}
.ndot:hover{border-color:var(--primary);color:var(--primary)}
.ndot.ok{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.ndot.ng{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}

/* Question card */
.qc{background:var(--card);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);transition:.2s}
.qc.ok{border-left:4px solid var(--success)}
.qc.ng{border-left:4px solid var(--danger)}
.qc-head{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qc-num{font-weight:800;font-size:1.05em}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:.7em;font-weight:600}
.tag-kp{background:var(--primary-bg);color:var(--primary)}
.tag-d{background:var(--warn-bg);color:var(--warn)}
.tag-p{background:#fce7f3;color:#be185d}
.qc-text{font-size:.92em;margin-bottom:10px;white-space:pre-wrap}

/* Sub-question */
.sq{margin:8px 0;padding-top:8px;border-top:1px dashed var(--border)}
.sq:first-child{border-top:none;padding-top:0}
.sq-label{font-weight:700;color:var(--primary);font-size:.82em;margin-bottom:4px}

/* Options */
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-radius:8px;cursor:pointer;border:1.5px solid var(--border);transition:.15s;font-size:.88em;line-height:1.5}
.opt:hover{border-color:var(--primary);background:var(--primary-bg)}
.opt.sel{border-color:var(--primary);background:var(--primary-bg)}
.opt.right{border-color:var(--success);background:var(--success-bg);cursor:default}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg);cursor:default}
.opt-l{font-weight:700;min-width:20px;flex-shrink:0}

/* Analysis */
.analysis{margin-top:10px;padding:12px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:8px;font-size:.84em;color:#166534;border:1px solid #bbf7d0;display:none;line-height:1.8}
.analysis.show{display:block}
.analysis b,.analysis strong{color:var(--success)}
.analysis .tip{background:#fff;border:1px solid #bbf7d0;border-radius:6px;padding:8px 10px;margin-top:8px}
.analysis .tip::before{content:'🎯 考试技巧：';font-weight:700}
.analysis table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.85em}
.analysis table th,.analysis table td{border:1px solid #bbf7d0;padding:4px 8px;text-align:left}
.analysis table th{background:#dcfce7}

/* Buttons */
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.82em;font-weight:600;transition:.15s}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{opacity:.9}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-d{background:var(--danger);color:#fff}

/* Summary */
.summary{background:var(--card);border-radius:var(--radius);padding:24px;margin:12px 0;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.summary .big{font-size:3em;font-weight:800;background:linear-gradient(135deg,var(--primary),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.summary .lbl{color:var(--text2);font-size:.9em}

/* KP stats */
.kp-stats{background:var(--card);border-radius:var(--radius);padding:12px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kp-stats h3{font-size:.9em;margin-bottom:8px;color:var(--text2)}
.kp-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.82em}
.kp-name{min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.kp-fill{height:100%;border-radius:4px;transition:width .3s}
.kp-num{min-width:50px;text-align:right;color:var(--text2)}

.footer{text-align:center;padding:16px;color:var(--text2);font-size:.75em}

@media(max-width:600px){.hdr h1{font-size:1em}.ctn{padding:6px}.qc{padding:12px}.ndot{width:26px;height:26px;font-size:.68em}.kp-name{min-width:90px}}
</style>
</head>
<body>
<div class="hdr">
  <h1><span class="ico">🎯</span>系统架构设计师 · 预测题</h1>
  <div class="sub" id="hStats">23题 · 基于2013年11月真题176题高频考点</div>
  <div class="prog"><div class="bar" id="progBar"></div></div>
</div>
<div class="ctn">
  <div class="nav" id="nav"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
  <div class="summary" id="summaryBox" style="display:none">
    <div class="lbl">最终正确率</div>
    <div class="big" id="sumScore">0%</div>
    <div style="margin-top:4px;color:var(--text2);font-size:.85em" id="sumDetail"></div>
    <div style="margin-top:12px"><button class="btn btn-d" onclick="resetAll()">🔄 清空重做</button></div>
  </div>
  <div class="kp-stats" id="kpStats"></div>
</div>
<div class="footer">基于 2013年11月系统架构真题 176题高频考点 · 23个不重复子考点 · 2026-05-21</div>

<script>
const DATA={"meta": {"paper_name": "系统架构设计师预测题（基于2013年11月真题高频考点）", "subject": 0, "type": 0, "item_count": 23}, "knowledge_points": [{"name": "软件架构风格", "summary_markdown": "高频考点：架构风格三要素、黑板风格、三层C/S架构、管道-过滤器vs批处理、规则系统等。"}, {"name": "软件质量属性", "summary_markdown": "高频考点：可用性场景识别、可靠性vs互操作性、开发期/运行期分类、质量属性场景六要素。"}, {"name": "软件架构评估", "summary_markdown": "高频考点：敏感点vs权衡点辨析、效用树结构、SAAM与ATAM区别。"}, {"name": "新技术架构", "summary_markdown": "高频考点：RESTful HTTP语义、不可变基础设施、物联网三层架构。"}, {"name": "基于架构的软件开发", "summary_markdown": "高频考点：ABSD文档化原则、体系结构演化六步骤。"}, {"name": "特定领域软件架构", "summary_markdown": "高频考点：DSSA四种角色职责、垂直域vs水平域辨析。"}, {"name": "4+1视图", "summary_markdown": "高频考点：4+1视图与利益相关者的映射关系。"}, {"name": "基本概念", "summary_markdown": "高频考点：ADL组成要素（组件、接口、连接件、配置）。"}, {"name": "面向服务架构", "summary_markdown": "高频考点：ESB核心作用与松耦合。"}, {"name": "软件架构复用", "summary_markdown": "高频考点：复用三阶段（构造/获取→管理→使用）。"}], "generated_at": "2026-05-21T06:00:00Z", "questions": [{"id": 1001, "index": 1, "sort": 1, "knowledge_point": "软件架构风格", "prompt": "软件架构风格是描述某一特定应用领域中系统组织方式的惯用模式。架构风格反映领域中众多系统所共有的结构和语义特征，强调对架构（　）的重用。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "设计阶段", "is_correct": true}, {"label": "B", "text": "代码实现", "is_correct": false}, {"label": "C", "text": "运行阶段", "is_correct": false}, {"label": "D", "text": "需求分析", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["设计阶段"], "official_analysis": "**正确答案：A. 设计阶段**\n\n**推理过程：** 软件架构风格（Architectural Style）是对软件系统组织方式的抽象描述。关键词\"惯用模式\"→ 这是一种设计层面的抽象，而非代码层面。架构风格定义的是组件类型、拓扑结构、连接规则等**设计蓝图**，因此强调的是对\"设计阶段\"产出物的重用。\n\n**逐项排除：**\n- B. 代码实现 → 架构风格不涉及具体代码，它是代码之上的抽象层\n- C. 运行阶段 → 运行阶段关注的是部署和执行，而架构风格在编码前就已确定\n- D. 需求分析 → 需求分析是架构设计的输入，不是架构风格重用的对象\n\n**知识点扩展：** 架构风格三要素 = **定义词汇表**（组件和连接件类型）+ **拓扑约束**（组件如何组合）+ **语义模型**（行为解释）。常见风格：管道-过滤器、分层、C/S、事件驱动、黑板、解释器、规则系统等。架构风格是可复用的设计知识，类似于\"设计模式\"但是更宏观。\n\n**考试技巧：** 看到\"架构风格+重用\"→ 答案几乎都是\"设计\"层面，而非代码或运行层面。"}]}, {"id": 1002, "index": 2, "sort": 2, "knowledge_point": "软件架构风格", "prompt": "某公司拟开发一个智能客服系统，该系统需要根据用户输入的自然语言问题，通过多个知识源（语义分析、意图识别、知识库检索）协同推导出最优答案。每个知识源独立工作，将中间结果写到共享空间中，由控制器决定下一步调用哪个知识源。针对该需求，采用（　）架构风格最为合适。", "difficulty": 2, "tags": ["预测题", "高频考点", "场景题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "管道-过滤器", "is_correct": false}, {"label": "B", "text": "黑板", "is_correct": true}, {"label": "C", "text": "解释器", "is_correct": false}, {"label": "D", "text": "事件驱动", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["黑板"], "official_analysis": "**正确答案：B. 黑板**\n\n**推理过程：** 题目关键词分析：①\"多个知识源\"→ 多个独立计算模块；②\"协同推导\"→ 非简单的线性流水线；③\"中间结果写到共享空间\"→ 有一个中央数据存储；④\"控制器决定下一步调用哪个知识源\"→ 有调度/控制机制。这完美匹配**黑板风格**的核心特征。\n\n**逐项排除：**\n- A. 管道-过滤器 → 数据是单向线性流动的，没有\"共享空间\"和\"控制器调度\"的概念\n- C. 解释器 → 用于自定义规则的解释执行，不涉及多知识源协同\n- D. 事件驱动 → 组件通过事件通知交互，但没有中央\"共享空间\"和\"控制器\"\n\n**知识点扩展：** 黑板风格 = **知识源**（独立计算模块）+ **黑板**（共享数据结构）+ **控制器**（调度哪个知识源下一步执行）。经典应用场景：语音识别、图像理解、机器翻译、专家系统推理。黑板风格与仓库风格的区别：黑板有控制器主动调度，仓库是被动的。\n\n**考试技巧：** 看到\"共享空间+多个知识源+控制器/调度\"→ 直接选黑板。看到\"语音识别/信号处理/知识推理\"场景题 → 大概率黑板。"}]}, {"id": 1003, "index": 3, "sort": 3, "knowledge_point": "软件架构风格", "prompt": "在三层C/S架构中，表示层、功能层和数据层分别承担不同职责。其中，功能层也称业务逻辑层，负责具体的业务处理。关于三层C/S架构，以下叙述中正确的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "表示层负责与用户交互，同时也承担主要的业务计算逻辑", "is_correct": false}, {"label": "B", "text": "功能层位于应用服务器上，负责接收表示层的请求并执行业务处理", "is_correct": true}, {"label": "C", "text": "数据层直接与用户进行交互，接收用户的输入", "is_correct": false}, {"label": "D", "text": "在三层C/S架构中，客户端比二层C/S架构中的客户端更加\"胖\"", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["功能层位于应用服务器上，负责接收表示层的请求并执行业务处理"], "official_analysis": "**正确答案：B. 功能层位于应用服务器上，负责接收表示层的请求并执行业务处理**\n\n**推理过程：** 三层C/S架构的核心思想是\"职责分离\"：表示层（瘦客户端）只管界面 → 功能层（应用服务器）管业务逻辑 → 数据层（数据库服务器）管数据存储。B选项准确描述了功能层的定位。\n\n**逐项排除：**\n- A. 表示层承担业务逻辑 → 违反职责分离原则，业务逻辑应在功能层\n- C. 数据层直接与用户交互 → 数据层只与功能层交互，不接触用户\n- D. 三层比二层更\"胖\" → 恰恰相反！三层架构的客户端比二层更\"瘦\"，因为业务逻辑被剥离到应用服务器\n\n**知识点扩展：** 二层C/S → 胖客户端（业务逻辑在客户端），维护困难。三层C/S → 瘦客户端+应用服务器+数据库，更灵活但通信开销增加。三层B/S → 浏览器做表示层，是三层C/S的Web化变体。\n\n**考试技巧：** 三层C/S关键词：\"瘦客户端\"、\"职责分离\"、\"功能层在应用服务器\"。凡说客户端变胖的→错。"}]}, {"id": 1004, "index": 4, "sort": 4, "knowledge_point": "软件架构风格", "prompt": "管道-过滤器架构风格中，每个处理步骤由一个过滤器实现，处理步骤之间的数据传输由管道负责。以下关于管道-过滤器风格与批处理风格的比较中，正确的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点", "对比辨析"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "管道-过滤器风格不支持并行处理，而批处理风格支持", "is_correct": false}, {"label": "B", "text": "批处理风格的数据必须作为整体传递，而管道-过滤器可以边接收边处理", "is_correct": true}, {"label": "C", "text": "两种风格都要求上一步完全结束后才能开始下一步", "is_correct": false}, {"label": "D", "text": "管道-过滤器的过滤器之间通过直接方法调用传递数据", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["批处理风格的数据必须作为整体传递，而管道-过滤器可以边接收边处理"], "official_analysis": "**正确答案：B. 批处理整体传递，管道-过滤器边接收边处理**\n\n**推理过程：** 两种风格的核心区别在于**数据流动方式**：批处理 = 整体输入 → 整体处理 → 整体输出（必须等上一步100%完成）；管道-过滤器 = 数据流式通过，过滤器可以边接收边处理（不必等全部数据到达）。这决定了管道-过滤器支持**并行处理**，而批处理不支持。\n\n**逐项排除：**\n- A. 说反了。管道-过滤器才支持并行（多个过滤器同时工作），批处理不支持\n- C. 批处理确实要求上一步完成，但管道-过滤器不要求（数据可以流式通过）\n- D. 管道-过滤器的过滤器之间通过**管道**（数据通道）传递数据，不是直接方法调用\n\n**知识点扩展：** 管道-过滤器 = 过滤器（处理）+ 管道（数据传输），优点：松耦合、支持并行、可复用；缺点：不适合交互式应用、传输开销。批处理 = 顺序执行、整体传递，优点：简单可靠；缺点：效率低。编译器的词法分析→语法分析→语义分析→代码生成就是经典管道-过滤器。\n\n**考试技巧：** 对比题记住一个核心词：批处理=\"整体\"，管道=\"流式\"。看到\"边接收边处理\"→ 管道；看到\"全部完成后才开始\"→ 批处理。"}]}, {"id": 1005, "index": 5, "sort": 5, "knowledge_point": "软件架构风格", "prompt": "某公司拟开发一个金融风控系统，该系统需要根据国家政策变化频繁调整风控规则和审批标准，要求在不修改系统代码的前提下快速响应规则变化。针对该需求，采用（　）架构风格最为合适。", "difficulty": 2, "tags": ["预测题", "高频考点", "场景题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "分层架构", "is_correct": false}, {"label": "B", "text": "面向对象", "is_correct": false}, {"label": "C", "text": "规则系统", "is_correct": true}, {"label": "D", "text": "进程通信", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["规则系统"], "official_analysis": "**正确答案：C. 规则系统**\n\n**推理过程：** 题目核心约束：①\"规则频繁变化\"→ 业务逻辑经常变；②\"不修改系统代码\"→ 逻辑与代码解耦；③\"快速响应\"→ 改规则立即生效。这完美匹配**规则系统**架构风格的核心优势：将业务规则从代码中抽离到规则库，规则变化时只改规则库，不改程序代码。\n\n**逐项排除：**\n- A. 分层架构 → 各层职责分离但业务逻辑仍在代码中，改规则需要改代码\n- B. 面向对象 → 通过继承和多态提供灵活性，但规则变化仍需修改类和重新编译\n- D. 进程通信 → 是一种并发/分布式通信机制，与规则管理无关\n\n**知识点扩展：** 规则系统（基于知识的架构）= **规则库**（存储业务规则）+ **推理引擎**（解释和执行规则）+ **工作内存**（当前事实）。适用场景：业务规则频繁变化（保险审批、信贷风控、促销策略）。与解释器风格的区别：解释器解释的是\"程序/脚本\"，规则系统解释的是\"业务规则\"。\n\n**考试技巧：** 看到\"不改代码\"+\"规则变化\"→ 直接选规则系统。看到\"策略/审批/风控/折扣\"等业务场景 → 规则系统概率极高。"}]}, {"id": 1006, "index": 6, "sort": 6, "knowledge_point": "软件质量属性", "prompt": "某公司欲开发一个在线医疗挂号系统，在架构设计阶段识别出以下质量属性场景：\"系统在遭遇服务器硬件故障后，能够在30秒内自动切换至备用服务器并恢复正常的挂号服务\"。该场景主要与（　）质量属性相关。", "difficulty": 2, "tags": ["预测题", "高频考点", "场景题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "性能", "is_correct": false}, {"label": "B", "text": "安全性", "is_correct": false}, {"label": "C", "text": "可用性", "is_correct": true}, {"label": "D", "text": "可修改性", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["可用性"], "official_analysis": "**正确答案：C. 可用性**\n\n**推理过程：** 场景关键词分析：①\"硬件故障\"→ 这是故障场景；②\"30秒内自动切换\"→ 关注的是**恢复时间**；③\"恢复正常服务\"→ 目标是系统继续可用。可用性的核心定义就是\"系统正常运行时间的比例\"和\"故障后多快能恢复\"。\n\n**逐项排除：**\n- A. 性能 → 性能关注的是\"响应时间\"和\"吞吐量\"，不是故障恢复\n- B. 安全性 → 安全性关注的是\"抵御攻击\"和\"数据保密\"，与故障恢复无关\n- D. 可修改性 → 关注的是\"改代码的难易程度\"，完全无关\n\n**知识点扩展：** 可用性通用策略：**心跳/Ping-echo**（检测故障）→ **冗余备机**（热备/冷备）→ **故障转移**（自动切换）→ **事务回滚**（数据一致性）。可用性与可靠性的区别：可靠性 = 多久不出故障（MTBF）；可用性 = 出了故障多快恢复（MTTR）。\n\n**考试技巧：** 看到\"故障+切换+恢复\"→ 可用性。看到\"响应时间+并发量\"→ 性能。看到\"攻击+加密+认证\"→ 安全性。看到\"修改+扩展+移植\"→ 可修改性。"}]}, {"id": 1007, "index": 7, "sort": 7, "knowledge_point": "软件质量属性", "prompt": "在软件质量属性中，（　）关注的是系统在一定时间内正常工作时间所占的比例，通常用MTBF/(MTBF+MTTR)来衡量；（　）关注的是软件系统与其他系统交换数据和相互调用服务的难易程度。", "difficulty": 3, "tags": ["预测题", "高频考点", "填空辨析"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "可靠性", "is_correct": true}, {"label": "B", "text": "可用性", "is_correct": false}, {"label": "C", "text": "安全性", "is_correct": false}, {"label": "D", "text": "性能", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["可靠性"], "official_analysis": "**第一空答案：A. 可靠性 | 第二空答案：A. 互操作性**\n\n**推理：**\n- **可靠性（Reliability）**：MTBF/(MTBF+MTTR) 衡量的是系统在规定条件和时间内完成规定功能的概率。MTBF（平均无故障时间）越长 → 越可靠；MTTR（平均修复时间）越短 → 越可靠。\n- **互操作性（Interoperability）**：关注的是系统与其他系统之间交换数据、相互调用服务的难易程度。典型场景：不同医院系统之间共享病历、银行系统与第三方支付对接。\n\n**易混淆辨析：**\n- 可靠性 vs 可用性：可靠性关注\"不出故障\"；可用性关注\"出了故障能快速恢复\"\n- 互操作性 vs 可移植性：互操作性是\"跟别人通信\"；可移植性是\"自己搬家\"\n\n**考试技巧：** 看到 MTBF/MTTR 公式 → 可靠性。看到\"系统间交换/对接/调用\"→ 互操作性。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "互操作性", "is_correct": true}, {"label": "B", "text": "可移植性", "is_correct": false}, {"label": "C", "text": "可修改性", "is_correct": false}, {"label": "D", "text": "可测试性", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["互操作性"], "official_analysis": "互操作性关注系统间交换数据和调用服务的难易程度。原题库Q104考查。"}]}, {"id": 1008, "index": 8, "sort": 8, "knowledge_point": "软件质量属性", "prompt": "基于软件系统的生命周期，可以将软件系统的质量属性分为开发期质量属性和运行期质量属性。以下选项中，（　）属于开发期质量属性，（　）属于运行期质量属性。", "difficulty": 2, "tags": ["预测题", "高频考点", "分类辨析"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "可维护性", "is_correct": true}, {"label": "B", "text": "性能", "is_correct": false}, {"label": "C", "text": "安全性", "is_correct": false}, {"label": "D", "text": "易用性", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["可维护性"], "official_analysis": "**第一空答案：A. 可维护性 | 第二空答案：C. 性能**\n\n**推理：** 软件质量属性的两大分类：\n\n**开发期质量属性**（在开发/维护阶段体现）：\n- 可维护性、可测试性、可修改性（含可扩展性）、可移植性\n\n**运行期质量属性**（系统运行时体现）：\n- 性能、安全性、可用性、易用性、可靠性、互操作性\n\n**逐项排除：**\n- B/D第一空：性能和易用性是运行期属性，不符合\n- C第一空：安全性是运行期属性，不符合\n- A/B/D第二空：可维护性、可测试性、可修改性都是开发期属性，不符合\n\n**记忆口诀：** 开发期 = \"维护测试改移植\"（5个）；运行期 = \"性安可用靠互操\"（6个）。性能永远是运行期，可维护性永远是开发期。\n\n**考试技巧：** 判断依据很简单：这个属性需要在系统\"运行\"时才能感知到吗？是→运行期，否→开发期。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "可维护性", "is_correct": false}, {"label": "B", "text": "可测试性", "is_correct": false}, {"label": "C", "text": "性能", "is_correct": true}, {"label": "D", "text": "可修改性", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["性能"], "official_analysis": "运行期质量属性包括性能、安全性、可用性等。原题库Q89考查。"}]}, {"id": 1009, "index": 9, "sort": 9, "knowledge_point": "软件质量属性", "prompt": "为了精确描述软件系统的质量属性，通常采用质量属性场景（Quality Attribute Scenario）作为描述手段。质量属性场景由六部分组成，其中\"刺激\"之后的下一个要素是（　），表示刺激发生时的系统状态。", "difficulty": 2, "tags": ["预测题", "高频考点", "六要素"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "制品", "is_correct": false}, {"label": "B", "text": "环境", "is_correct": true}, {"label": "C", "text": "响应", "is_correct": false}, {"label": "D", "text": "响应度量", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["环境"], "official_analysis": "**正确答案：B. 环境**\n\n**推理过程：** 质量属性场景（Quality Attribute Scenario）的六要素按严格顺序排列：\n\n**刺激源 → 刺激 → 环境 → 制品 → 响应 → 响应度量**\n\n题目问\"刺激之后的下一个要素\"→ 答案是**环境**，表示刺激发生时系统所处的状态（如\"系统正常在线\"、\"系统处于高负载状态\"等）。\n\n**逐项排除：**\n- A. 制品 → 排第4位，是\"被刺激影响的对象\"（如数据库、用户界面）\n- C. 响应 → 排第5位，是\"系统作出的反应\"（如切换到备用服务器）\n- D. 响应度量 → 排第6位，是\"衡量响应是否达标的指标\"（如30秒内恢复）\n\n**知识点扩展：** 六要素记忆口诀：**\"源激环品应量\"**。每个要素的示例（可用性场景）：刺激源=外部攻击者 → 刺激=DDoS攻击 → 环境=正常在线 → 制品=Web服务 → 响应=自动限流 → 响应度量=99.9%可用。\n\n**考试技巧：** 六要素排序题是高频考点。记住\"环境\"紧跟\"刺激\"后面——\"刺激发生在什么环境下？\""}]}, {"id": 1010, "index": 10, "sort": 10, "knowledge_point": "软件架构评估", "prompt": "在架构评估中，\"敏感点\"和\"权衡点\"是两个重要概念。以下描述中，属于\"权衡点\"的是（　）。", "difficulty": 3, "tags": ["预测题", "高频考点", "辨析题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "增加缓存大小可以显著提高系统响应速度", "is_correct": false}, {"label": "B", "text": "将数据库连接池大小从10调整为50，系统的并发处理能力明显增强", "is_correct": false}, {"label": "C", "text": "采用更高强度的加密算法虽然提高了安全性，但增加了CPU开销导致响应时间增加", "is_correct": true}, {"label": "D", "text": "系统目前使用单点登录模块，存在单点故障风险", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["采用更高强度的加密算法虽然提高了安全性，但增加了CPU开销导致响应时间增加"], "official_analysis": "**正确答案：C. 加密算法提高安全性但降低性能**\n\n**推理过程：** 权衡点（Tradeoff）的定义：**一个设计决策同时影响两个或多个质量属性，且这些影响是此消彼长的**。C选项中，加密强度↑ → 安全性↑ 但 CPU 开销↑ → 响应时间↑（性能↓），这是典型的此消彼长。\n\n**逐项排除：**\n- A. 增加缓存 → 只影响响应速度（性能），不涉及其他属性 → 这是**敏感点**\n- B. 连接池调大 → 只影响并发能力（性能），不涉及其他属性 → 也是**敏感点**\n- D. 单点登录有故障风险 → 这是一个已知的**风险点**（可能出问题的地方），不涉及多属性权衡\n\n**核心概念辨析：**\n- **敏感点**：一个设计决策影响**一个**质量属性（如缓存→性能）\n- **权衡点**：一个设计决策影响**多个**质量属性且此消彼长（如加密→安全↑+性能↓）\n- **风险点**：架构中可能存在问题的地方（如单点故障）\n- **非风险点**：已经确认没有问题的设计决策\n\n**考试技巧：** 看到\"虽然...但是...\"、\"提高了A但降低了B\"→ 权衡点。看到\"显著提高\"单一属性 → 敏感点。看到\"存在风险/隐患\"→ 风险点。"}]}, {"id": 1011, "index": 11, "sort": 11, "knowledge_point": "软件架构评估", "prompt": "在ATAM方法中，效用树（Utility Tree）是进行架构评估的重要工具。效用树的树形结构从根节点到叶子节点依次为（　）。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "质量属性→属性分类→质量属性场景", "is_correct": true}, {"label": "B", "text": "质量属性→优先级→属性分类→质量属性场景", "is_correct": false}, {"label": "C", "text": "属性分类→质量属性→优先级→质量属性场景", "is_correct": false}, {"label": "D", "text": "质量属性→属性分类→优先级→质量属性场景", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["质量属性→属性分类→质量属性场景"], "official_analysis": "**正确答案：A. 质量属性 → 属性分类 → 质量属性场景**\n\n**推理过程：** 效用树（Utility Tree）是 ATAM 方法中的核心工具，用于组织和优先级排序质量属性需求。其树形结构为：\n\n**根节点（Utility）→ 第一层：质量属性（如性能、安全性、可用性）→ 第二层：属性分类/细化（如\"性能-延迟\"、\"性能-吞吐量\"）→ 叶子节点：质量属性场景**\n\n**逐项排除：**\n- B. \"优先级\"作为树的层级 → 错！优先级是标注在叶子节点上的标签（高/中/低），不是树的独立层级\n- C. \"属性分类\"排在\"质量属性\"前面 → 错！应该是先大类后小类\n- D. 同B的错误，把\"优先级\"当成了树的层级\n\n**知识点扩展：** 效用树的作用：①将模糊的质量属性需求具体化为场景；②通过优先级排序（高/中/低）聚焦最重要的场景；③帮助评估人员发现架构设计中的权衡点和敏感点。效用树的两个维度优先级：**对利益相关者的重要程度** × **从架构角度看的技术难度**。\n\n**考试技巧：** 效用树结构 = \"大→小→具体\"（属性→分类→场景），优先级只是标签不是层级。看到\"优先级\"出现在树的路径中 → 错误选项。"}]}, {"id": 1012, "index": 12, "sort": 12, "knowledge_point": "软件架构评估", "prompt": "在软件架构评估方法中，SAAM（基于场景的架构分析方法）和ATAM（架构权衡分析方法）是两种经典方法。以下关于两者区别的描述，正确的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点", "方法对比"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "SAAM是在ATAM基础上发展起来的，增加了成本效益分析", "is_correct": false}, {"label": "B", "text": "SAAM针对最终架构而非详细设计进行评估，ATAM用于分析多种质量属性之间的折中", "is_correct": true}, {"label": "C", "text": "SAAM主要关注成本和投资回报率，ATAM只关注性能", "is_correct": false}, {"label": "D", "text": "两种方法都不使用场景作为评估工具", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["SAAM针对最终架构而非详细设计进行评估，ATAM用于分析多种质量属性之间的折中"], "official_analysis": "**正确答案：B. SAAM针对最终架构评估，ATAM分析质量属性折中**\n\n**推理过程：**\n- **SAAM**（Software Architecture Analysis Method）：最早出现的架构评估方法，主要关注**功能架构的适合性**和**架构演化的影响**，针对的是**最终架构**而非详细设计。\n- **ATAM**（Architecture Tradeoff Analysis Method）：在SAAM基础上发展而来，核心增强是**分析多种质量属性之间的折中关系**（特别是性能、安全性、可用性、可修改性）。\n\n**逐项排除：**\n- A. SAAM是在ATAM基础上发展 → 错！是ATAM在SAAM基础上发展\n- C. SAAM关注成本回报率 → 错！这是CBAM关注的\n- D. 两种方法不用场景 → 错！场景是两种方法的核心评估工具\n\n**知识点扩展：** 架构评估方法演进路线：SAAM（功能/演化）→ ATAM（质量属性权衡）→ CBAM（成本效益分析）。三种方法都使用\"场景\"作为评估驱动。ATAM的4个步骤：场景和需求收集 → 架构视图和场景实现 → 属性模型构造和分析 → 折中分析。\n\n**考试技巧：** SAAM = \"适合性+演化\"；ATAM = \"权衡+多属性\"；CBAM = \"成本+效益\"。看到\"折中/权衡\"→ ATAM；看到\"成本\"→ CBAM。"}]}, {"id": 1013, "index": 13, "sort": 13, "knowledge_point": "新技术架构", "prompt": "在RESTful架构风格中，HTTP方法具有明确的语义约定。当客户端需要更新服务端某个资源的全部内容时，应使用（　）方法；当只需要更新资源的部分字段时，应使用（　）方法。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "POST", "is_correct": false}, {"label": "B", "text": "PUT", "is_correct": true}, {"label": "C", "text": "PATCH", "is_correct": false}, {"label": "D", "text": "DELETE", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["PUT"], "official_analysis": "**第一空答案：B. PUT | 第二空答案：B. PATCH**\n\n**推理过程：** RESTful 架构中 HTTP 方法的语义约定：\n\n| 方法 | 语义 | 幂等性 | 安全性 |\n|------|------|--------|--------|\n| GET | 获取资源 | 幂等 | 安全 |\n| POST | 创建新资源 | 非幂等 | 不安全 |\n| PUT | **全量替换**更新 | 幂等 | 不安全 |\n| PATCH | **局部修改**更新 | 非幂等 | 不安全 |\n| DELETE | 删除资源 | 幂等 | 不安全 |\n\n- **PUT** = \"我把整个资源的新状态给你，你用它覆盖旧的\"→ 全量更新\n- **PATCH** = \"我只给你要改的那几个字段，你帮我改\"→ 局部更新\n\n**易混淆辨析：** PUT vs PATCH：PUT必须提供完整资源（缺少的字段会被置空）；PATCH只提供需要修改的字段。POST vs PUT：POST用于创建新资源（返回新ID）；PUT用于更新已有资源。\n\n**考试技巧：** RESTful题记住：全量=PUT，局部=PATCH，创建=POST，获取=GET，删除=DELETE。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "GET", "is_correct": false}, {"label": "B", "text": "PATCH", "is_correct": true}, {"label": "C", "text": "PUT", "is_correct": false}, {"label": "D", "text": "DELETE", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["PATCH"], "official_analysis": "PATCH用于局部更新。原题库Q106、Q150考查。"}]}, {"id": 1014, "index": 14, "sort": 14, "knowledge_point": "新技术架构", "prompt": "在云原生架构中，\"不可变基础设施（Immutable Infrastructure）\"是一项核心实践原则。关于不可变基础设施，以下描述正确的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点", "云原生"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "基础设施一旦部署后就不允许做任何修改，如有变更需求必须重新构建和部署新实例", "is_correct": true}, {"label": "B", "text": "基础设施在运行过程中可以随时通过SSH登录进行手动配置修改", "is_correct": false}, {"label": "C", "text": "不可变基础设施要求所有服务必须运行在同一台物理机上", "is_correct": false}, {"label": "D", "text": "不可变基础设施主要目的是提高硬件的计算性能", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["基础设施一旦部署后就不允许做任何修改，如有变更需求必须重新构建和部署新实例"], "official_analysis": "**正确答案：A. 部署后不修改，变更需重建新实例**\n\n**推理过程：** 不可变基础设施（Immutable Infrastructure）是云原生的核心实践，其核心思想是：**服务器/容器一旦部署，就像\"烧录到光盘\"一样不可修改**。如果需要变更配置、升级版本、修复问题，不是SSH上去手动改，而是用新的镜像**重新构建一个全新的实例**替换旧的。\n\n**逐项排除：**\n- B. SSH手动修改 → 这正是不可变基础设施**禁止**的操作（属于\"可变基础设施\"）\n- C. 所有服务在同一台物理机 → 与不可变基础设施无关，容器化天然支持多机分布\n- D. 目的是提高计算性能 → 目的是**一致性、可重复、可审计**，不是性能\n\n**知识点扩展：** 不可变基础设施的优势：①**一致性**：开发、测试、生产环境完全一致（同一镜像）；②**可重复**：任何时候都能用同一镜像重建出相同环境；③**可回滚**：出问题直接切回旧镜像；④**可审计**：每次变更都是新镜像，变更历史清晰。实现技术：Docker镜像、VM模板、Packer等。\n\n**考试技巧：** 看到\"不可变\"→ 想到\"烧光盘\"（写死不可改）。看到\"SSH/手动修改\"→ 可变基础设施（错误选项）。"}]}, {"id": 1015, "index": 15, "sort": 15, "knowledge_point": "新技术架构", "prompt": "物联网（IoT）系统通常分为三层架构。其中，负责信息采集和物体识别（如RFID、传感器等设备）的是（　）；负责将采集到的数据进行传输和通信（如5G、WiFi等）的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "应用层", "is_correct": false}, {"label": "B", "text": "感知层", "is_correct": true}, {"label": "C", "text": "网络传输层", "is_correct": false}, {"label": "D", "text": "数据层", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["感知层"], "official_analysis": "**第一空答案：B. 感知层 | 第二空答案：C. 网络传输层**\n\n**推理过程：** 物联网三层架构从底到顶：\n\n**感知层**（\"眼睛和手\"）→ 采集物理世界数据：RFID标签、传感器（温度/湿度/光照）、摄像头、GPS定位等\n\n**网络传输层**（\"快递网络\"）→ 将感知层数据传输到应用层：5G、4G、WiFi、蓝牙、LoRa、NB-IoT、 ZigBee等\n\n**应用层**（\"大脑\"）→ 对数据进行处理和展示：智能家居控制、工业监控大屏、智慧城市平台等\n\n**逐项排除：**\n- A/D. 应用层/数据层 → 应用层负责数据利用，不是采集\n- D. 数据层 → 物联网标准三层模型中没有\"数据层\"这一层\n\n**知识点扩展：** 物联网三层 vs 五层模型：三层是最常考的（感知-网络-应用）；五层进一步细分为：感知层→接入层→网络层→处理层→应用层。考试中以三层为主。物联网 vs 互联网：物联网的核心区别在于\"物物相连\"（Thing-to-Thing），终端是传感器/设备而非电脑/手机。\n\n**考试技巧：** 三层口诀：**\"感知\"采集 → \"网络\"传输 → \"应用\"使用**。采集=感知，传输=网络，使用=应用。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "应用层", "is_correct": false}, {"label": "B", "text": "感知层", "is_correct": false}, {"label": "C", "text": "网络传输层", "is_correct": true}, {"label": "D", "text": "数据层", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["网络传输层"], "official_analysis": "物联网三层：感知→网络传输→应用。原题库Q63、Q103考查。"}]}, {"id": 1016, "index": 16, "sort": 16, "knowledge_point": "基于架构的软件开发", "prompt": "在基于架构的软件设计（ABSD）方法中，架构文档化是一个重要活动。以下关于架构文档化原则的描述，（　）是不符合要求的。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "应从使用者的角度书写文档", "is_correct": false}, {"label": "B", "text": "随时保证文档都是最新的，每次代码修改后立即更新架构文档", "is_correct": true}, {"label": "C", "text": "将文档分发给相关人员", "is_correct": false}, {"label": "D", "text": "针对不同背景的人员书写文档的方式应不同", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["随时保证文档都是最新的，每次代码修改后立即更新架构文档"], "official_analysis": "**正确答案：B. 随时保证文档都是最新的，每次代码修改后立即更新架构文档**\n\n**推理过程：** 这是一道\"找错\"题。ABSD的架构文档化有明确的原则，而\"每次代码修改后立即更新架构文档\"违反了架构文档的更新时机。架构文档应该在**关键的里程碑节点**进行更新和审核，而不是随代码变更频繁修改。\n\n**ABSD文档化的正确原则：**\n- A. 从使用者的角度书写文档 → ✅ 文档是给人看的，要站在读者角度\n- B. 每次代码修改后立即更新 → ❌ **这是错误选项**，应该是里程碑节点更新\n- C. 将文档分发给相关人员 → ✅ 确保利益相关者都能获取到\n- D. 针对不同受众用不同方式 → ✅ 给开发者看技术细节，给管理者看高层概览\n\n**知识点扩展：** ABSD架构文档化的主要输出：**架构规格说明书**（描述架构的设计决策、组件、连接件、约束等）和**架构测试用例**（验证架构是否满足需求）。文档化的作用：①沟通工具（开发团队内部）；②培训材料（新成员入职）；③维护参考（后续演化依据）。\n\n**考试技巧：** 看到\"随时更新\"、\"立即更新\"、\"每次修改\"→ 大概率是错误选项。架构文档更新频率应该是\"适度\"的。"}]}, {"id": 1017, "index": 17, "sort": 17, "knowledge_point": "基于架构的软件开发", "prompt": "ABSDM将整个基于体系结构的软件过程划分为6个子过程。体系结构演化的6个步骤按正确顺序排列是：①需求变化归类、②制订演化计划、③修改/增加/删除构件、④（　）、⑤构件组装与测试、⑥技术评审。", "difficulty": 2, "tags": ["预测题", "高频考点", "步骤排序"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "更新构件的相互作用", "is_correct": true}, {"label": "B", "text": "架构复审", "is_correct": false}, {"label": "C", "text": "重新进行需求分析", "is_correct": false}, {"label": "D", "text": "修改架构风格", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["更新构件的相互作用"], "official_analysis": "**正确答案：A. 更新构件的相互作用**\n\n**推理过程：** 体系结构演化的6个步骤按顺序：\n\n①**需求变化归类** → 理清哪些需求变了、怎么变\n②**制订演化计划** → 规划怎么改、改哪些、什么顺序\n③**修改/增加/删除构件** → 实际动手改代码/组件\n④**更新构件的相互作用** → 修改了构件后，构件之间的接口、调用关系、数据流也要同步更新\n⑤**构件组装与测试** → 把改好的构件组装起来，测试是否正常工作\n⑥**技术评审** → 专家审查演化结果是否正确、是否引入新问题\n\n**记忆口诀：理→定→改→连→测→评**（理清需求、定计划、改构件、连关系、测功能、评结果）\n\n**逐项排除：**\n- B. 架构复审 → 这是ABSD六个过程中的独立活动，不是演化步骤之一\n- C. 重新进行需求分析 → 演化是在已有需求基础上调整，不需要重新分析\n- D. 修改架构风格 → 演化一般不改变整体架构风格，只是调整构件\n\n**考试技巧：** 六步骤排序是高频题。关键是第④步\"更新构件的相互作用\"——很多人忘了改完构件后还要更新它们之间的关系。"}]}, {"id": 1018, "index": 18, "sort": 18, "knowledge_point": "特定领域软件架构", "prompt": "DSSA中的参与角色可以分为四种。其中，负责提供业务经验和需求、并对领域模型和DSSA进行复审的角色是（　）；负责根据领域模型开发出DSSA，并验证其准确性和一致性的角色是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点", "角色辨析"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "领域专家", "is_correct": true}, {"label": "B", "text": "领域分析者", "is_correct": false}, {"label": "C", "text": "领域设计者", "is_correct": false}, {"label": "D", "text": "领域实现者", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["领域专家"], "official_analysis": "**第一空答案：A. 领域专家 | 第二空答案：C. 领域设计者**\n\n**推理过程：** DSSA的四种角色各司其职：\n\n| 角色 | 职责 |\n|------|------|\n| **领域专家** | 提供领域知识和业务经验、提出需求、**参与复审** |\n| **领域分析者** | 控制整个领域分析过程、提取领域知识、构建领域模型 |\n| **领域设计者** | **根据领域模型开发DSSA**、验证架构的准确性和一致性 |\n| **领域实现者** | 根据DSSA开发具体构件、实现可复用的软件资产 |\n\n**推理：** ①\"提供业务经验和需求\"+\"进行复审\" → 这是**领域专家**的职责（他们是最了解业务的人，也是最终的验收者）；②\"根据领域模型开发出DSSA\"+\"验证准确性\" → 这是**领域设计者**的职责（架构师角色）。\n\n**DSSA三活动对应三产物：** 领域分析 → **领域模型** | 领域设计 → **DSSA** | 领域实现 → **可复用构件**\n\n**考试技巧：** 专家=懂业务/提需求/当裁判；分析者=控制过程/建模；设计者=开发DSSA；实现者=写代码。口诀：**\"专家提，分析建，设计架，实现码\"**。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "领域专家", "is_correct": false}, {"label": "B", "text": "领域分析者", "is_correct": false}, {"label": "C", "text": "领域设计者", "is_correct": true}, {"label": "D", "text": "领域实现者", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["领域设计者"], "official_analysis": "领域设计者=根据模型开发DSSA。原题库Q4、Q10、Q24、Q29反复考查。"}]}, {"id": 1019, "index": 19, "sort": 19, "knowledge_point": "特定领域软件架构", "prompt": "DSSA中，从功能覆盖范围的角度可以分为垂直域和水平域。其中，垂直域是指（　），水平域是指（　）。", "difficulty": 3, "tags": ["预测题", "高频考点", "辨析题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "垂直域定义单个系统族的整体架构，水平域定义多个系统族的共有部分", "is_correct": true}, {"label": "B", "text": "垂直域定义多个系统族的共有部分，水平域定义单个系统族的整体架构", "is_correct": false}, {"label": "C", "text": "垂直域关注系统间的通信协议，水平域关注系统内的数据存储", "is_correct": false}, {"label": "D", "text": "垂直域面向特定用户群体，水平域面向所有用户", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["垂直域定义单个系统族的整体架构，水平域定义多个系统族的共有部分"], "official_analysis": "**正确答案：A. 垂直域=单系统族整体架构，水平域=多系统族共有部分**\n\n**推理过程：** DSSA从功能覆盖范围角度分为两种类型：\n\n- **垂直域（Vertical Domain）**：针对**一个特定领域/一个系统族**的完整架构。例如：专门为\"银行业\"设计一整套架构（从底层数据到上层应用，\"一挖到底\"）。特点是纵向深、覆盖全。\n- **水平域（Horizontal Domain）**：跨越**多个不同领域**的**共有/公共部分**。例如：多种行业系统都需要\"用户认证模块\"，把这部分抽取出来作为通用架构。特点是横向宽、聚焦公共。\n\n**逐项排除：**\n- B. 说反了，垂直和水平的定义完全颠倒\n- C. \"通信协议\"和\"数据存储\"不是垂直/水平域的定义角度\n- D. \"用户群体\"不是分类依据，DSSA按功能覆盖范围分，不按用户分\n\n**形象记忆：** 垂直域像\"钻井\"——在一块地上打到底（一个领域挖深）；水平域像\"修桥\"——连接多块地（跨领域横向共享）。\n\n**考试技巧：** 垂直=\"一挖到底\"（单领域深挖），水平=\"横向共享\"（跨领域公共）。"}]}, {"id": 1020, "index": 20, "sort": 20, "knowledge_point": "4+1视图", "prompt": "在Kruchten提出的\"4+1\"视图模型中，不同视图面向不同的利益相关者。其中，（　）视图面向最终用户，描述系统的功能需求；（　）视图面向系统集成人员，捕捉设计的并发和同步特征。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "逻辑视图", "is_correct": true}, {"label": "B", "text": "开发视图", "is_correct": false}, {"label": "C", "text": "进程视图", "is_correct": false}, {"label": "D", "text": "物理视图", "is_correct": false}], "correct_letters": ["A"], "correct_texts": ["逻辑视图"], "official_analysis": "**第一空答案：A. 逻辑视图 | 第二空答案：C. 进程视图**\n\n**推理过程：** Kruchten的\"4+1\"视图模型中，4个视图各有面向的利益相关者：\n\n| 视图 | 面向角色 | 描述内容 |\n|------|---------|---------|\n| **逻辑视图** | 最终用户/分析师 | 功能需求、对象模型 |\n| **开发视图** | 程序员 | 代码组织、模块结构、类图 |\n| **进程视图** | 系统集成人员 | **并发、同步、通信**、运行时行为 |\n| **物理视图** | 系统工程师/运维 | 部署拓扑、硬件映射、网络配置 |\n| **场景（+1）** | 所有角色 | 用例/场景驱动验证 |\n\n**推理：** ①\"面向最终用户\"+\"功能需求\"→ **逻辑视图**；②\"面向系统集成人员\"+\"并发和同步\"→ **进程视图**\n\n**知识点扩展：** \"4+1\"中\"1\"指的是**场景（用例）**，它驱动其他4个视图的开发和验证。UML对应：逻辑视图→类图/对象图；开发视图→包图/组件图；进程视图→活动图/序列图；物理视图→部署图。\n\n**考试技巧：** 用户→逻辑，程序员→开发，集成→进程，运维→物理，\"+1\"→场景。"}, {"label": "2", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "逻辑视图", "is_correct": false}, {"label": "B", "text": "开发视图", "is_correct": false}, {"label": "C", "text": "进程视图", "is_correct": true}, {"label": "D", "text": "物理视图", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["进程视图"], "official_analysis": "进程视图面向系统集成人员，捕捉并发同步。原题库Q9、Q62、Q147高频考查。"}]}, {"id": 1021, "index": 21, "sort": 21, "knowledge_point": "基本概念", "prompt": "架构描述语言（Architecture Description Language, ADL）是一种为明确说明软件系统的概念架构和对这些概念架构建模提供功能的语言。ADL的组成部分主要包括组件、组件接口、（　）和架构配置。", "difficulty": 1, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "数据结构", "is_correct": false}, {"label": "B", "text": "算法逻辑", "is_correct": false}, {"label": "C", "text": "连接件", "is_correct": true}, {"label": "D", "text": "测试用例", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["连接件"], "official_analysis": "**正确答案：C. 连接件**\n\n**推理过程：** 架构描述语言（ADL）用于形式化描述软件架构，其核心组成要素：\n\n| 要素 | 含义 | 作用 |\n|------|------|------|\n| **组件（Component）** | 计算或数据的独立单元 | 承担系统的核心功能 |\n| **组件接口（Interface）** | 组件对外暴露的交互点 | 定义组件提供的和需要的服务 |\n| **连接件（Connector）** | 组件之间的交互机制 | 处理组件间的通信、协调和数据传递 |\n| **架构配置（Configuration）** | 组件和连接件的拓扑排列 | 定义系统的整体结构 |\n\n**推理：** \"组件、接口\"已给出，\"配置\"已给出，缺少的就是**连接件**。连接件是独立于组件的实体，负责处理组件间的通信（如管道、事件总线、RPC、共享变量等）。\n\n**逐项排除：**\n- A. 数据结构 → 太底层，是组件内部实现，不是架构层面的概念\n- B. 算法逻辑 → 同上，是组件内部实现细节\n- D. 测试用例 → 是验证手段，不是架构描述的组成要素\n\n**知识点扩展：** 常见ADL：Wright（关注连接件行为）、C2（关注层次结构）、Acme（通用ADL框架）。ADL不是编程语言，它是描述架构设计的\"蓝图语言\"。\n\n**考试技巧：** ADL四要素 = **\"组件接口连配置\"**。连接件是常被忽略但最常考的要素。"}]}, {"id": 1022, "index": 22, "sort": 22, "knowledge_point": "面向服务架构", "prompt": "在面向服务架构（SOA）中，企业服务总线（ESB）是实现SOA的核心中间件基础设施。以下关于ESB的描述，错误的是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点", "找错题"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "ESB通过提供消息路由和协议转换能力，消除了服务之间的直接链接", "is_correct": false}, {"label": "B", "text": "ESB在服务请求者与服务提供者之间充当中介，实现了松耦合", "is_correct": false}, {"label": "C", "text": "ESB要求所有服务之间保持紧密耦合关系以提高通信效率", "is_correct": true}, {"label": "D", "text": "ESB支持不同协议和消息格式之间的转换", "is_correct": false}], "correct_letters": ["C"], "correct_texts": ["ESB要求所有服务之间保持紧密耦合关系以提高通信效率"], "official_analysis": "**正确答案：C. ESB要求所有服务之间保持紧密耦合关系以提高通信效率**\n\n**推理过程：** 这是一道\"找错\"题。ESB（Enterprise Service Bus，企业服务总线）的核心设计目标就是**解耦**——在服务请求者和服务提供者之间插入一个中间层，消除它们之间的直接依赖关系。说ESB\"要求紧密耦合\"完全违背了其设计初衷。\n\n**ESB的正确功能：**\n- A. 消息路由和协议转换 → ✅ ESB的核心能力，消除服务之间的直接链接\n- B. 充当中介实现松耦合 → ✅ 这就是ESB存在的意义\n- C. 要求紧密耦合 → ❌ **完全相反**，ESB的核心价值就是松耦合\n- D. 支持不同协议转换 → ✅ ESB能转换SOAP/REST/JMS等各种协议\n\n**知识点扩展：** ESB核心能力：①**路由**（消息转发到正确的服务）；②**转换**（协议/格式转换）；③**中介**（服务解耦）；④**编排**（复杂业务流程组合）。SOA vs 微服务：SOA用ESB做集中式集成（\"大总线\"），微服务用API Gateway做轻量级集成（去中心化）。\n\n**考试技巧：** 看到\"ESB+紧密耦合\"→ 直接判定为错误选项。ESB的一切设计都围绕\"松耦合\"。"}]}, {"id": 1023, "index": 23, "sort": 23, "knowledge_point": "软件架构复用", "prompt": "软件架构复用的基本过程可以划分为三个主要阶段。其中，第一个阶段\"构造/获取\"的主要工作是（　）。", "difficulty": 2, "tags": ["预测题", "高频考点"], "sub_questions": [{"label": "1", "question": "", "correct_answer": "", "options": [{"label": "A", "text": "将复用资产分门别类管理，存入仓库", "is_correct": false}, {"label": "B", "text": "构造恰当的、可复用的资产，或从外部获取现成的组件", "is_correct": true}, {"label": "C", "text": "在新项目中引入依赖，实际使用复用资产", "is_correct": false}, {"label": "D", "text": "对复用资产进行功能测试和性能评估", "is_correct": false}], "correct_letters": ["B"], "correct_texts": ["构造恰当的、可复用的资产，或从外部获取现成的组件"], "official_analysis": "**正确答案：B. 构造恰当的、可复用的资产，或从外部获取现成的组件**\n\n**推理过程：** 软件架构复用的基本过程分为三个阶段，按顺序：\n\n**第一阶段：构造/获取** → \"进货\"：构造恰当的可复用资产，或从外部获取现成组件。这是复用过程的起点——先要有可复用的东西。\n\n**第二阶段：管理** → \"入库\"：将复用资产分门别类地管理，存入可复用资产库，建立索引和检索机制。\n\n**第三阶段：使用** → \"发货\"：在新项目中引入可复用资产，实际使用这些资产来构建系统。\n\n**逐项排除：**\n- A. 分门别类管理，存入仓库 → 这是第二阶段\"管理\"的工作，不是第一阶段\n- C. 在新项目中实际使用 → 这是第三阶段\"使用\"的工作\n- D. 功能测试和性能评估 → 这是附加的验证活动，不是三阶段之一\n\n**知识点扩展：** 软件复用两个层次：**机会复用**（开发过程中\"顺便\"复用已有的东西，被动随机）vs **系统复用**（有计划、有组织地规划和建设可复用资产库，主动系统化）。系统复用效果更好但投入更大。\n\n**考试技巧：** 三阶段口诀：**\"造→管→用\"**（造资产→管仓库→用起来）。第一阶段问\"做什么\"→\"造或买\"（构造或获取）。"}]}]};

function buildFilters(){
  const kps=['全部',...DATA.knowledge_points.map(k=>k.name)];
  document.getElementById('filters').innerHTML=kps.map(k=>
    `<span class="fpill ${k===(filter==='all'?'全部':filter)?'on':''}" onclick="setFilter('${k==='全部'?'all':k}')">${k}</span>`
  ).join('');
}
function setFilter(k){filter=k;buildFilters();render();}

function buildNav(){
  document.getElementById('nav').innerHTML=DATA.questions.map(q=>{
    const s=status(q);
    return `<div class="ndot ${s}" onclick="document.getElementById('q'+${q.id}).scrollIntoView({behavior:'smooth',block:'center'})">${q.index}</div>`;
  }).join('');
}

function status(q){
  const a=ans[q.id];
  if(!a)return '';
  for(const sq of q.sub_questions){
    if(!a[sq.label])return '';
    if(!sq.correct_letters.includes(a[sq.label]))return 'ng';
  }
  return 'ok';
}

function render(){
  const qs=filter==='all'?DATA.questions:DATA.questions.filter(q=>q.knowledge_point===filter);
  document.getElementById('list').innerHTML=qs.map(q=>renderQ(q)).join('');
}

function renderQ(q){
  const s=status(q);
  const cls=s==='ok'?'ok':s==='ng'?'ng':'';
  const a=ans[q.id]||{};
  const dl=q.difficulty===1?'简单':q.difficulty===2?'中等':'较难';
  return `<div class="qc ${cls}" id="q${q.id}">
    <div class="qc-head">
      <span class="qc-num">第${q.index}题</span>
      <span class="tag tag-kp">${q.knowledge_point}</span>
      <span class="tag tag-d">${dl}</span>
      <span class="tag tag-p">预测题</span>
    </div>
    <div class="qc-text">${q.prompt}</div>
    ${q.sub_questions.map(sq=>renderSQ(q,sq,a)).join('')}
    <div class="analysis ${s?'show':''}" id="ana${q.id}">
      ${q.sub_questions.map((sq,i)=>`<div>${q.sub_questions.length>1?`<b>第${sq.label}问：</b><br>`:''}${fmtAnalysis(sq.official_analysis,q.sub_questions.length>1&&i<q.sub_questions.length-1)}</div>`).join('')}
    </div>
    <div class="btns">
      ${s?`<button class="btn btn-o" onclick="document.getElementById('ana${q.id}').classList.add('show')">📖 查看解析</button>`
        :`<button class="btn btn-p" onclick="submitQ(${q.id})">✅ 提交答案</button>`}
    </div>
  </div>`;
}

function renderSQ(q,sq,a){
  const sel=a[sq.label]||'';
  const s=status(q);
  return `<div class="sq">
    ${q.sub_questions.length>1?`<div class="sq-label">▸ 第${sq.label}问</div>`:''}
    <div class="opts">${sq.options.map(o=>{
      let cls='';
      if(s){if(o.is_correct)cls='right';else if(o.label===sel&&!o.is_correct)cls='wrong';}
      else if(o.label===sel)cls='sel';
      const fn = s ? '' : `pick(${q.id},'${sq.label}','${o.label}')`;
      return `<div class="opt ${cls}" onclick="${fn}">
        <span class="opt-l">${o.label}.</span><span>${o.text}</span>
      </div>`;
    }).join('')}</div>
  </div>`;
}

function fmtAnalysis(txt,addHr){
  // Bold **text**
  let s=txt.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s+(addHr?'<hr style="margin:8px 0;border:none;border-top:1px dashed #bbf7d0">':'');
}

function pick(qid,sub,opt){
  if(!ans[qid])ans[qid]={};
  const prev=ans[qid][sub];
  ans[qid][sub]=opt;
  save();
  render();
  updateProg();
}

function submitQ(qid){
  const q=DATA.questions.find(q=>q.id===qid);
  const a=ans[qid]||{};
  for(const sq of q.sub_questions){
    if(!a[sq.label]){alert('请先完成所有小题再提交');return;}
  }
  render();updateProg();buildNav();
}

function save(){localStorage.setItem('pred_ans',JSON.stringify(ans));}

function updateProg(){
  const total=DATA.questions.length;
  let done=0,right=0;
  DATA.questions.forEach(q=>{const s=status(q);if(s){done++;if(s==='ok')right++;}});
  document.getElementById('progBar').style.width=(done/total*100)+'%';
  document.getElementById('hStats').textContent=`${total}题 · 已答${done} · 正确${right}`+(done?` · ${(right/done*100).toFixed(0)}%`:'');
  if(done===total){
    document.getElementById('summaryBox').style.display='';
    document.getElementById('sumScore').textContent=(right/total*100).toFixed(0)+'%';
    document.getElementById('sumDetail').textContent=`共${total}题，正确${right}题，错误${done-right}题`;
  }
  buildNav();
  buildKPStats();
}

function buildKPStats(){
  const stats={};
  DATA.knowledge_points.forEach(k=>{stats[k.name]={total:0,right:0,done:0};});
  DATA.questions.forEach(q=>{
    const kp=q.knowledge_point;
    stats[kp].total++;
    const s=status(q);
    if(s){stats[kp].done++;if(s==='ok')stats[kp].right++;}
  });
  const colors=['#6366f1','#8b5cf6','#a78bfa','#c084fc','#e879f9','#f472b6','#fb7185','#f97316','#eab308','#22c55e'];
  let html='<h3>📊 各知识点正确率</h3>';
  let i=0;
  for(const[kp,v]of Object.entries(stats)){
    const pct=v.done?v.right/v.total*100:0;
    html+=`<div class="kp-row"><span class="kp-name">${kp}</span><div class="kp-bar"><div class="kp-fill" style="width:${pct}%;background:${colors[i%10]}"></div></div><span class="kp-num">${v.right}/${v.total}</span></div>`;
    i++;
  }
  document.getElementById('kpStats').innerHTML=html;
}

function resetAll(){
  if(!confirm('确定清空所有答题记录？'))return;
  ans={};localStorage.removeItem('pred_ans');
  document.getElementById('summaryBox').style.display='none';
  render();updateProg();
}

init();
</script>
</body>
</html>
